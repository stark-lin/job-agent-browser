name: Package
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64 apparmor
      - name: Permit sandbox namespaces for test executables
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux-ci.sh
      - run: npm ci
      - run: npx --no-install install-electron
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/models
          key: embedding-${{ hashFiles('resources/embedding-model.json') }}
      - run: npm run model:prepare && npm run model:verify
      - run: npm run build
      - name: Offline model and real MCP verification
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:embedding
          else
            npm run test:embedding
          fi
      - name: Build and verify installers
        env:
          JAB_RELEASE_BUILD: ${{ inputs.release }}
          JAB_SIGNING: ${{ inputs.release && vars.RELEASE_SIGNING || 'unsigned' }}
          JAB_MAC_CSC_LINK: ${{ inputs.release && secrets.MAC_CSC_LINK || '' }}
          JAB_MAC_CSC_KEY_PASSWORD: ${{ inputs.release && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          JAB_WIN_CSC_LINK: ${{ inputs.release && secrets.WIN_CSC_LINK || '' }}
          JAB_WIN_CSC_KEY_PASSWORD: ${{ inputs.release && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          JAB_APPLE_API_KEY: ${{ inputs.release && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.release && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.release && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/ci-package.cjs
          else
            node scripts/ci-package.cjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/publish/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*debug*
            release/builder-effective-config.yaml
          if-no-files-found: ignore
          retention-days: 7
