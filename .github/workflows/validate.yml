name: Validate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: Runtime (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          architecture: arm64
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - name: Validate source, tests, build and MCP
        run: npm run check
      - run: npm run test:release
      - name: Electron and Knowledge runtime
        run: node scripts/run-smoke.cjs && node scripts/run-knowledge-smoke.cjs
